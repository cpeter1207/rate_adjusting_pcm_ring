[package]
name = "rate-adjusting-pcm-ring2"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Lock-free rate-adjusting canonical-F32 PCM ring for rpt_advanced"
repository = "https://github.com/cpeter1207/rate_adjusting_pcm_ring"
publish = false

[lib]
name = "rate_adjusting_pcm_ring2"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
panic = "abort"
