name: Required quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  quality:
    uses: cpeter1207/rate_adjusting_pcm_ring_workflows/.github/workflows/quality.yml@main
    with:
      fast_only: ${{ github.event_name == 'push' }}
      samplerate_adapter_tag: v0.1.0-alpha.2
